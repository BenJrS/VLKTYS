name: Build EXE (Windows) & DMG (macOS)

# Chạy tự động khi push lên main, hoặc bấm "Run workflow" trong tab Actions.
# Kết quả tải ở mục "Artifacts" của lần chạy.

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        app: [CauA_GaussSeidel, CauB_MonteCarlo]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build with PyInstaller
        working-directory: ${{ matrix.app }}
        run: pyinstaller --noconfirm ${{ matrix.app }}.spec
      - name: Package .dmg (macOS)
        if: runner.os == 'macOS'
        working-directory: ${{ matrix.app }}/dist
        run: hdiutil create -volname "${{ matrix.app }}" -srcfolder "${{ matrix.app }}.app" -ov -format UDZO "${{ matrix.app }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ runner.os == 'Windows' && 'windows-exe' || 'macos-dmg' }}
          path: |
            ${{ matrix.app }}/dist/*.exe
            ${{ matrix.app }}/dist/*.dmg
